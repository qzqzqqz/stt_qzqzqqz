<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary": "#f8f7ff",
                    "on-tertiary-container": "#4a4a65",
                    "tertiary-dim": "#51516c",
                    "inverse-on-surface": "#9a9d9f",
                    "secondary-dim": "#465468",
                    "background": "#f7f9fb",
                    "outline": "#717c82",
                    "error-dim": "#4e0309",
                    "surface": "#f7f9fb",
                    "on-primary-fixed-variant": "#0050d4",
                    "surface-tint": "#0053db",
                    "primary-fixed-dim": "#c7d3ff",
                    "primary-dim": "#0048c1",
                    "primary-container": "#dbe1ff",
                    "error-container": "#fe8983",
                    "secondary": "#526074",
                    "on-tertiary-fixed": "#373851",
                    "surface-container-lowest": "#ffffff",
                    "surface-variant": "#d9e4ea",
                    "on-error-container": "#752121",
                    "on-secondary-fixed-variant": "#4e5c71",
                    "secondary-fixed-dim": "#c7d5ed",
                    "primary": "#0053db",
                    "surface-container": "#e8eff3",
                    "on-background": "#2a3439",
                    "on-surface-variant": "#566166",
                    "inverse-surface": "#0b0f10",
                    "on-tertiary": "#fbf7ff",
                    "error": "#9f403d",
                    "on-error": "#fff7f6",
                    "tertiary": "#5d5d78",
                    "on-secondary-fixed": "#324053",
                    "surface-bright": "#f7f9fb",
                    "tertiary-fixed-dim": "#cbc9e9",
                    "surface-dim": "#cfdce3",
                    "surface-container-low": "#f0f4f7",
                    "on-primary-container": "#0048bf",
                    "tertiary-container": "#d9d7f8",
                    "on-surface": "#2a3439",
                    "secondary-container": "#d5e3fc",
                    "tertiary-fixed": "#d9d7f8",
                    "secondary-fixed": "#d5e3fc",
                    "on-secondary": "#f8f8ff",
                    "on-tertiary-fixed-variant": "#54546f",
                    "on-secondary-container": "#455367",
                    "surface-container-highest": "#d9e4ea",
                    "primary-fixed": "#dbe1ff",
                    "surface-container-high": "#e1e9ee",
                    "outline-variant": "#a9b4b9",
                    "on-primary-fixed": "#003798",
                    "inverse-primary": "#618bff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fb;
        }
    </style>
</head>
<body class="bg-background text-on-background selection:bg-primary-container selection:text-on-primary-container min-h-screen flex flex-col">
<!-- Top Navigation Placeholder (following Shell Visibility & Relevance: Suppressed as Transactional Page) -->
<!-- The TopAppBar and SideNavBar are suppressed for this login screen to prioritize focus -->
<main class="flex-grow flex items-center justify-center p-6 md:p-12 relative overflow-hidden">
<!-- Abstract Editorial Shapes for The Sonic Gallery aesthetic -->
<div class="absolute top-[-10%] right-[-5%] w-[400px] h-[400px] bg-secondary-container/30 rounded-full blur-[80px] pointer-events-none"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[300px] h-[300px] bg-primary-container/20 rounded-full blur-[60px] pointer-events-none"></div>
<div class="w-full max-w-md z-10">
<!-- Brand Anchor -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center p-4 bg-surface-container-lowest rounded-xl mb-6 shadow-[0_12px_40px_rgba(42,52,57,0.06)]">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="waves" style="font-variation-settings: 'FILL' 1;">waves</span>
</div>
<h1 class="text-3xl font-black tracking-tighter text-on-surface mb-2">The Sonic Gallery</h1>
<p class="text-on-surface-variant text-sm font-medium">Editorial Transcription Excellence</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-8 md:p-10 shadow-[0_20px_50px_rgba(42,52,57,0.04)] border-none">
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div class="space-y-2">
<label class="block text-xs font-bold uppercase tracking-wider text-on-surface-variant ml-1" for="email">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-sm" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-11 pr-4 py-3.5 bg-surface-container-low border-none rounded-lg text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/20 transition-all duration-200" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-xs font-bold uppercase tracking-wider text-on-surface-variant" for="password">Password</label>
<a class="text-xs font-semibold text-primary hover:text-primary-dim transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-sm" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-11 pr-4 py-3.5 bg-surface-container-low border-none rounded-lg text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary/20 transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- CTA -->
<button class="w-full py-4 bg-gradient-to-br from-primary to-primary-dim text-on-primary font-bold rounded-lg shadow-lg shadow-primary/20 hover:shadow-xl hover:shadow-primary/30 active:scale-[0.98] transition-all duration-200" type="submit">
                        Sign In
                    </button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-variant"></div>
</div>
<div class="relative flex justify-center text-xs">
<span class="px-4 bg-surface-container-lowest text-outline-variant font-medium uppercase tracking-widest">or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-3 px-4 bg-surface-container-low hover:bg-surface-container-high rounded-lg text-sm font-semibold text-on-surface transition-colors duration-200">
<span class="material-symbols-outlined text-lg" data-icon="google">google</span>
                        Google
                    </button>
<button class="flex items-center justify-center gap-2 py-3 px-4 bg-surface-container-low hover:bg-surface-container-high rounded-lg text-sm font-semibold text-on-surface transition-colors duration-200">
<span class="material-symbols-outlined text-lg" data-icon="apple">ios</span>
                        Apple
                    </button>
</div>
</div>
<!-- Footer Link -->
<p class="text-center mt-8 text-on-surface-variant text-sm font-medium">
                New to the Gallery? 
                <a class="text-primary font-bold ml-1 hover:underline decoration-2 underline-offset-4 transition-all" href="#">Create an account</a>
</p>
</div>
</main>
<!-- Shared Footer Component -->
<footer class="bg-slate-50 dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 full-width py-12 flex flex-col items-center justify-center gap-4 w-full">
<div class="flex gap-8 mb-4">
<a class="text-xs font-medium tracking-wide uppercase text-slate-400 hover:text-blue-600 transition-colors" href="#">Privacy</a>
<a class="text-xs font-medium tracking-wide uppercase text-slate-400 hover:text-blue-600 transition-colors" href="#">Terms</a>
<a class="text-xs font-medium tracking-wide uppercase text-slate-400 hover:text-blue-600 transition-colors" href="#">API</a>
</div>
<p class="text-xs font-medium tracking-wide uppercase text-slate-400">© 2024 The Sonic Gallery. Editorial Precision.</p>
</footer>
</body></html>
